name: Mac app

# Builds the self-contained Mac app: Python, the code and every voice inside,
# so it runs with no internet and nothing else installed. It is slow, so it
# runs only for a version tag or by hand. A tag's release is published as
# soon as the app passes its check.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Build the app
        run: ./mac/build-app.sh --bundle

      - name: Check it reads with no internet
        run: ./mac/check-app.sh dist/Earful.app

      - name: Make the disk image
        run: ./mac/make-dmg.sh dist/Earful.app dist/Earful.dmg

      - name: Pack the browser extension
        run: extension/pack.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Earful-mac
          path: |
            dist/Earful.dmg
            dist/earful-extension-*.zip
          retention-days: 14

      # Made as a draft, filled, then published: nobody sees a release
      # without its files. It only gets here if the app passed the check.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{version}/${GITHUB_REF_NAME#v}/g" mac/release-notes.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Earful $GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/Earful.dmg dist/earful-extension-*.zip --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
