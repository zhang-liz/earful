<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>READ IT TO ME</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    /* Muted 8-bit palette: dark slate ground, amber highlight. */
    --bg:      #14121c;
    --panel:   #221f30;
    --panel-2: #2c283d;
    --ink:     #ece5d8;
    --muted:   #8b849c;
    --amber:   #f2b33d;
    --amber-d: #c9821b;
    --green:   #7bc86c;
    --shadow:  #0b0a11;
    --line:    #453f5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Press Start 2P", ui-monospace, Menlo, monospace;
    font-size: 10px;
    line-height: 1.9;
    /* Faint scanline wash, the CRT look. */
    background-image: repeating-linear-gradient(
      0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
    image-rendering: pixelated;
  }

  /* Hard-edged blocks: no radius anywhere, offset shadow instead. */
  .box {
    background: var(--panel);
    border: 3px solid var(--shadow);
    box-shadow: 4px 4px 0 var(--shadow);
  }

  .layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 18px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 18px 24px;
    min-height: 100%;
    align-items: start;
  }

  /* ---------- sidebar ---------- */
  .side { position: sticky; top: 18px; display: grid; gap: 14px; }
  .side .box { padding: 14px; }
  h1 {
    font-size: 13px;
    margin: 0 0 4px;
    color: var(--amber);
    text-shadow: 2px 2px 0 var(--shadow);
    line-height: 1.5;
  }
  .tagline { color: var(--muted); font-size: 8px; margin: 0; line-height: 1.8; }
  .legend {
    font-size: 8px;
    color: var(--amber);
    margin: 0 0 10px;
    letter-spacing: .05em;
  }
  label { display: block; font-size: 8px; color: var(--muted); margin: 0 0 7px; }

  select {
    width: 100%;
    padding: 9px;
    background: var(--panel-2);
    color: var(--ink);
    border: 2px solid var(--line);
    font: inherit;
    font-size: 8px;
    line-height: 1.6;
  }
  select:focus-visible, button:focus-visible, .part:focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 2px;
  }

  /* Chunky pressable buttons. */
  button {
    font: inherit;
    font-size: 9px;
    color: var(--ink);
    background: var(--panel-2);
    border: 2px solid var(--shadow);
    box-shadow: 3px 3px 0 var(--shadow);
    padding: 10px 8px;
    cursor: pointer;
    transition: none;
  }
  button:hover:not(:disabled) { background: var(--line); }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: var(--amber);
    color: var(--shadow);
    width: 100%;
    padding: 13px 8px;
  }
  button.primary:hover:not(:disabled) { background: var(--amber-d); }

  .speeds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .speeds button.on { background: var(--amber); color: var(--shadow); }
  .fine { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  input[type=range] {
    flex: 1; accent-color: var(--amber); height: 14px; min-width: 0;
  }
  .fine span { font-size: 8px; color: var(--amber); white-space: nowrap; }

  .transport { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 7px; }

  /* Blocky progress meter, drawn as discrete cells. */
  .meter {
    height: 14px;
    background: var(--panel-2);
    border: 2px solid var(--shadow);
    display: flex;
    gap: 2px;
    padding: 2px;
    margin: 10px 0 8px;
  }
  .meter i { flex: 1; background: var(--shadow); }
  .meter i.lit { background: var(--green); }
  .stat { font-size: 8px; color: var(--muted); line-height: 1.9; }
  .stat b { color: var(--ink); font-weight: normal; }

  /* ---------- middle: the article ---------- */
  .main { display: grid; gap: 14px; min-width: 0; }
  .main .box { padding: 16px; }

  textarea {
    width: 100%;
    min-height: 320px;
    resize: vertical;
    padding: 14px;
    background: var(--panel-2);
    color: var(--ink);
    border: 2px solid var(--line);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.75;
  }
  textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .reader { display: grid; gap: 10px; }
  .part {
    display: block;
    width: 100%;
    text-align: left;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
    line-height: 1.85;
    color: var(--muted);
    background: transparent;
    border: 2px solid transparent;
    box-shadow: none;
    padding: 11px 13px;
    cursor: pointer;
    white-space: pre-wrap;
  }
  .part:hover { color: var(--ink); background: var(--panel-2); }
  .part:active { transform: none; }
  .part.pending { opacity: .5; cursor: wait; }
  .part.done { color: #b3aac6; }
  .part.now {
    color: var(--ink);
    background: var(--panel-2);
    border-color: var(--amber);
    box-shadow: 3px 3px 0 var(--shadow);
  }
  /* The single word being spoken right now. */
  .w { padding: 1px 0; }
  .part.now .w.lit {
    background: var(--amber);
    color: var(--shadow);
    box-shadow: 2px 0 0 var(--amber), -2px 0 0 var(--amber);
  }

  /* A blinking caret marks the part being spoken. */
  .part.now::before {
    content: "\25B6";
    color: var(--amber);
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    margin-right: 9px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .part.now::before { animation: none; }
  }

  .hint { font-size: 8px; color: var(--muted); margin: 0; line-height: 1.9; }
  .err {
    font-size: 9px; color: var(--shadow); background: #e06666;
    padding: 10px; margin: 0; line-height: 1.8;
  }
  .hidden { display: none !important; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- ================= sidebar: every control ================= -->
  <aside class="side">
    <div class="box">
      <h1>READ IT<br />TO ME</h1>
      <p class="tagline">PASTE TEXT.<br />PRESS PLAY.</p>
    </div>

    <div class="box">
      <p class="legend">// VOICE</p>
      <select id="voice" aria-label="Voice"></select>
      <div style="height:10px"></div>
      <button id="sample" style="width:100%">HEAR VOICE</button>
    </div>

    <div class="box">
      <p class="legend">// SPEED</p>
      <div class="speeds" id="presets">
        <button data-speed="1">1x</button>
        <button data-speed="1.5">1.5x</button>
        <button data-speed="2">2x</button>
      </div>
      <div class="fine">
        <input id="speed" type="range" min="0.5" max="3" step="0.05" value="1" aria-label="Fine speed" />
        <span id="speedLabel">1.00x</span>
      </div>
    </div>

    <div class="box" id="playbox">
      <p class="legend">// PLAYER</p>
      <div class="transport">
        <button id="prev" title="Previous part">&#9198;</button>
        <button id="toggle" title="Play or pause">&#9654;</button>
        <button id="next" title="Next part">&#9197;</button>
      </div>
      <div class="meter" id="meter" aria-hidden="true"></div>
      <p class="stat">
        <b id="statusLine">IDLE</b><br />
        <span id="clock"></span>
      </p>
      <div style="height:8px"></div>
      <button id="download" class="hidden" style="width:100%">SAVE .WAV</button>
    </div>
  </aside>

  <!-- ================= middle: the article ================= -->
  <main class="main">
    <div class="box" id="inputBox">
      <p class="legend">// YOUR TEXT</p>
      <textarea id="text" placeholder="Paste an article, a chapter, notes - any length."></textarea>
      <div style="height:12px"></div>
      <button id="go" class="primary">&#9654; READ IT TO ME</button>
      <div style="height:10px"></div>
      <p class="hint" id="count">0 WORDS</p>
      <p class="err hidden" id="error"></p>
    </div>

    <div class="box hidden" id="readerBox">
      <p class="legend">// NOW READING &mdash; CLICK ANY PART TO JUMP</p>
      <div class="reader" id="reader"></div>
      <div style="height:12px"></div>
      <button id="edit">&#9664; EDIT TEXT</button>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const text = $("text"), voice = $("voice"), speed = $("speed");

// One reused <audio>; swapping its src at a part boundary is what lets
// playback start before the whole document has finished rendering.
const player = new Audio();
player.preservesPitch = true;      // speed up without chipmunk voice
player.mozPreservesPitch = true;
player.webkitPreservesPitch = true;
window.player = player;            // handy from the console

let job = null;        // { id, total, texts }
let ready = 0;         // parts the server has finished
let index = 0;         // part being played now
let playing = false;
let stream = null;
let waiting = false;   // playback caught up to rendering
let started = false;   // has this job begun playing at all

/* ---------- text box ---------- */
function refreshCount() {
  const value = text.value.trim();
  const words = value ? value.split(/\s+/).length : 0;
  const minutes = words / (150 * Number(speed.value));
  $("count").textContent = words
    ? `${words.toLocaleString()} WORDS / ~${minutes < 1 ? "<1" : Math.round(minutes)} MIN`
    : "0 WORDS";
}

async function loadVoices() {
  const data = await (await fetch("/voices")).json();
  for (const item of data.voices) {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.label.toUpperCase();
    voice.append(option);
  }
  voice.value = data.default;
}

/* ---------- speed ---------- */
function applySpeed() {
  const rate = Number(speed.value);
  player.playbackRate = rate;
  $("speedLabel").textContent = `${rate.toFixed(2)}x`;
  // Light the preset only when it matches exactly.
  for (const button of $("presets").children) {
    button.classList.toggle("on", Number(button.dataset.speed) === rate);
  }
  refreshCount();
}
function setSpeed(value) {
  speed.value = String(value);
  applySpeed();
}

/* ---------- the article ---------- */
function drawReader() {
  const reader = $("reader");
  reader.textContent = "";
  job.texts.forEach((body, i) => {
    const part = document.createElement("button");
    part.className = "part";
    part.dataset.i = i;
    // One span per word, so a single word can be lit while it is spoken.
    // Whitespace between words is kept as plain text to preserve wrapping.
    for (const piece of body.split(/(\s+)/)) {
      if (!piece) continue;
      if (/^\s+$/.test(piece)) {
        part.append(piece);
      } else {
        const word = document.createElement("span");
        word.className = "w";
        word.textContent = piece;
        part.append(word);
      }
    }
    part.addEventListener("click", () => jumpTo(i));
    reader.append(part);
  });
  paintReader();
}

/* ---------- word-by-word highlight ---------- */
// Timings arrive per part: [{t: "word", s: startSec, e: endSec}, ...]
const timings = new Map();   // part index -> word list
let litWord = -1;            // span index currently lit
let raf = null;

async function loadTimings(i) {
  if (timings.has(i)) return timings.get(i);
  try {
    const response = await fetch(`/words/${job.id}/${i}`);
    if (!response.ok) return null;
    const data = await response.json();
    timings.set(i, data.words);
    return data.words;
  } catch { return null; }
}

// Kokoro emits a token per word AND per punctuation mark, while the reader
// makes a span per whitespace-separated word. Map one to the other by walking
// both in order and matching on letters only.
function alignWords(spans, words) {
  const clean = (s) => s.toLowerCase().replace(/[^a-z0-9']/g, "");
  const map = new Array(spans.length).fill(null);
  let w = 0;
  for (let s = 0; s < spans.length; s++) {
    const target = clean(spans[s].textContent);
    if (!target) continue;
    let built = "";
    const startWord = w;
    while (w < words.length) {
      built += clean(words[w].t);
      w++;
      if (built === target) {                       // one or more tokens = one span
        map[s] = { start: words[startWord].s, end: words[w - 1].e };
        break;
      }
      if (built.length > target.length) {           // drifted; resync
        w = startWord + 1;
        break;
      }
    }
  }
  return map;
}

function stopHighlight() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  document.querySelectorAll(".w.lit").forEach((el) => el.classList.remove("lit"));
  litWord = -1;
}

async function startHighlight(i) {
  stopHighlight();
  const words = await loadTimings(i);
  const part = $("reader").children[i];
  if (!words || !part || index !== i) return;

  const spans = [...part.querySelectorAll(".w")];
  const map = alignWords(spans, words);

  const tick = () => {
    if (!playing || index !== i) { raf = null; return; }
    const now = player.currentTime;
    // Find the span whose window contains the playhead.
    let found = -1;
    for (let s = 0; s < map.length; s++) {
      const span = map[s];
      if (span && now >= span.start && now < span.end) { found = s; break; }
    }
    if (found !== litWord) {
      if (litWord >= 0 && spans[litWord]) spans[litWord].classList.remove("lit");
      if (found >= 0 && spans[found]) spans[found].classList.add("lit");
      litWord = found;
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function paintReader() {
  if (!job) return;
  [...$("reader").children].forEach((part, i) => {
    part.classList.toggle("now", i === index && started);
    part.classList.toggle("done", i < index);
    part.classList.toggle("pending", i >= ready);
  });
}

function drawMeter() {
  const meter = $("meter");
  if (meter.children.length !== job.total) {
    meter.textContent = "";
    for (let i = 0; i < job.total; i++) meter.append(document.createElement("i"));
  }
  [...meter.children].forEach((cell, i) => cell.classList.toggle("lit", i < ready));
}

function setStatus() {
  if (!job) { $("statusLine").textContent = "IDLE"; $("clock").textContent = ""; return; }
  $("statusLine").textContent =
    waiting ? "BUFFERING..."
    : playing ? `PART ${index + 1} / ${job.total}`
    : index >= job.total ? "FINISHED"
    : started ? "PAUSED"
    : "GETTING READY...";
  $("clock").textContent = ready < job.total
    ? `${ready}/${job.total} PARTS READY`
    : "ALL PARTS READY";
  drawMeter();
  paintReader();
}

/* ---------- playback ---------- */
function playChunk(i) {
  if (!job) return;
  if (i >= job.total) {                 // reached the end
    playing = false;
    index = job.total;
    $("toggle").innerHTML = "&#9654;";
    setStatus();
    return;
  }
  if (i >= ready) {                     // rendering has not caught up
    waiting = true;
    index = i;
    setStatus();
    return;
  }
  waiting = false;
  index = i;
  player.src = `/chunk/${job.id}/${i}.wav`;
  player.playbackRate = Number(speed.value);
  player.play().catch(() => { playing = false; $("toggle").innerHTML = "&#9654;"; });
  startHighlight(i);
  setStatus();
  // Keep the spoken part in view without yanking the page around.
  const part = $("reader").children[i];
  if (part) part.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function jumpTo(i) {
  if (!job || i >= ready) return;       // not rendered yet
  started = true;
  playing = true;
  $("toggle").innerHTML = "&#10074;&#10074;";
  playChunk(i);
}

player.addEventListener("ended", () => {
  stopHighlight();
  if (playing) playChunk(index + 1);
});

function toggle() {
  if (!job) return;
  if (playing) {
    player.pause();
    playing = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    $("toggle").innerHTML = "&#9654;";
    setStatus();
    return;
  }
  playing = true;
  $("toggle").innerHTML = "&#10074;&#10074;";
  if (started && !player.ended && player.currentTime > 0) {
    player.play().catch(() => {});      // resume mid-part
    startHighlight(index);
    setStatus();
  } else {
    started = true;
    playChunk(index);
  }
}

/* ---------- start a narration ---------- */
async function speak() {
  if (!text.value.trim()) { text.focus(); return; }
  if (stream) { stream.close(); stream = null; }
  player.pause();

  job = null; ready = 0; index = 0;
  playing = false; waiting = false; started = false;
  stopHighlight();
  timings.clear();
  $("error").classList.add("hidden");
  $("download").classList.add("hidden");
  $("toggle").innerHTML = "&#9654;";
  $("go").disabled = true;
  $("statusLine").textContent = "GETTING READY...";

  const response = await fetch("/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text.value, voice: voice.value })
  });
  $("go").disabled = false;

  if (!response.ok) {
    const detail = await response.json().catch(() => ({ detail: response.statusText }));
    fail(detail.detail || "Something went wrong.");
    return;
  }

  job = await response.json();
  $("inputBox").classList.add("hidden");
  $("readerBox").classList.remove("hidden");
  drawReader();
  setStatus();

  stream = new EventSource(`/progress/${job.id}`);
  stream.onmessage = (event) => {
    const update = JSON.parse(event.data);
    ready = update.done;

    if (ready > 0 && !started) {            // first part exists: begin
      started = true;
      playing = true;
      $("toggle").innerHTML = "&#10074;&#10074;";
      playChunk(0);
    } else if (waiting && ready > index) {  // we ran dry, now we can resume
      playChunk(index);
    }

    if (update.state === "ready") {
      stream.close(); stream = null;
      $("download").classList.remove("hidden");
    } else if (update.state === "error") {
      stream.close(); stream = null;
      fail(update.error);
      return;
    }
    setStatus();
  };
  stream.onerror = () => { if (stream) { stream.close(); stream = null; } };
}

function fail(message) {
  $("go").disabled = false;
  $("statusLine").textContent = "STOPPED";
  $("inputBox").classList.remove("hidden");
  $("error").textContent = message;
  $("error").classList.remove("hidden");
}

async function sample() {
  $("sample").disabled = true;
  const line = "This is how I sound. I can read your whole article in this voice.";
  const response = await fetch("/preview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: line, voice: voice.value })
  });
  $("sample").disabled = false;
  if (!response.ok) return;
  const audio = new Audio(URL.createObjectURL(await response.blob()));
  audio.preservesPitch = true;
  audio.playbackRate = Number(speed.value);
  audio.play();
}

/* ---------- wiring ---------- */
text.addEventListener("input", refreshCount);
speed.addEventListener("input", applySpeed);
for (const button of $("presets").children) {
  button.addEventListener("click", () => setSpeed(Number(button.dataset.speed)));
}
$("go").addEventListener("click", speak);
$("sample").addEventListener("click", sample);
$("toggle").addEventListener("click", toggle);
$("prev").addEventListener("click", () => job && jumpTo(Math.max(index - 1, 0)));
$("next").addEventListener("click", () => job && jumpTo(index + 1));
$("download").addEventListener("click", () => {
  if (job) window.location.href = `/download/${job.id}.wav`;
});
$("edit").addEventListener("click", () => {
  player.pause();
  playing = false;
  $("toggle").innerHTML = "&#9654;";
  $("readerBox").classList.add("hidden");
  $("inputBox").classList.remove("hidden");
  text.focus();
});

document.addEventListener("keydown", (event) => {
  if (event.target === text || !job) return;
  if (event.code === "Space") { event.preventDefault(); toggle(); }
  if (event.code === "ArrowRight") { event.preventDefault(); jumpTo(index + 1); }
  if (event.code === "ArrowLeft") { event.preventDefault(); jumpTo(Math.max(index - 1, 0)); }
});

loadVoices();
setSpeed(1);
refreshCount();
</script>
</body>
</html>
