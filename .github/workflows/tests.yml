name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: |
          uv sync
          npm ci --prefix app

      - name: Server tests
        run: uv run pytest

      - name: Web page tests
        run: npm test --prefix app

      - name: Chrome extension tests
        run: |
          npm test --prefix extension
          python3 extension/check-manifest.py extension

      # The editor extension's tests talk to a real server with the real model,
      # which also checks that a version update has not broken the voice.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m

      - name: Start the server
        run: |
          # Not through uv run: it would hold uv's cache lock while the server
          # runs, and uv's cleanup at the end of the job would wait and then fail.
          .venv/bin/python -m uvicorn app.server:app --port 8888 > server.log 2>&1 &
          curl --silent --output /dev/null --retry 60 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8888/voices

      - name: Editor extension tests
        run: npm test --prefix editor-extension

      - name: Show the server log
        if: failure()
        run: tail -n 100 server.log || true
