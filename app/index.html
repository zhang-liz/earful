<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EARFUL</title>
<!-- Saved to an iPhone Home Screen, this opens without Safari's chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Earful" />
<link rel="icon" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />
<meta name="theme-color" content="#14121c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    /* Muted 8-bit palette: dark slate ground, amber highlight. */
    --bg:      #14121c;
    --panel:   #221f30;
    --panel-2: #2c283d;
    --ink:     #ece5d8;
    --muted:   #8b849c;
    --amber:   #f2b33d;
    --amber-d: #c9821b;
    --green:   #7bc86c;
    --shadow:  #0b0a11;
    --line:    #453f5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Press Start 2P", ui-monospace, Menlo, monospace;
    font-size: 10px;
    line-height: 1.9;
    /* Faint scanline wash, the CRT look. */
    background-image: repeating-linear-gradient(
      0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
    image-rendering: pixelated;
  }

  /* Hard-edged blocks: no radius anywhere, offset shadow instead. */
  .box {
    background: var(--panel);
    border: 3px solid var(--shadow);
    box-shadow: 4px 4px 0 var(--shadow);
  }

  .layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 18px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 18px 24px;
    min-height: 100%;
    align-items: start;
  }

  /* ---------- sidebar ---------- */
  .side { position: sticky; top: 18px; display: grid; gap: 14px; }
  .side .box { padding: 14px; }
  h1 {
    font-size: 13px;
    margin: 0 0 4px;
    color: var(--amber);
    text-shadow: 2px 2px 0 var(--shadow);
    line-height: 1.5;
  }
  .tagline { color: var(--muted); font-size: 8px; margin: 0; line-height: 1.8; }
  .legend {
    font-size: 8px;
    color: var(--amber);
    margin: 0 0 10px;
    letter-spacing: .05em;
  }
  label { display: block; font-size: 8px; color: var(--muted); margin: 0 0 7px; }

  select {
    width: 100%;
    padding: 9px;
    background: var(--panel-2);
    color: var(--ink);
    border: 2px solid var(--line);
    font: inherit;
    font-size: 8px;
    line-height: 1.6;
  }
  select:focus-visible, button:focus-visible, .part:focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 2px;
  }

  /* Chunky pressable buttons. */
  button {
    font: inherit;
    font-size: 9px;
    color: var(--ink);
    background: var(--panel-2);
    border: 2px solid var(--shadow);
    box-shadow: 3px 3px 0 var(--shadow);
    padding: 10px 8px;
    cursor: pointer;
    transition: none;
  }
  button:hover:not(:disabled) { background: var(--line); }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: var(--amber);
    color: var(--shadow);
    width: 100%;
    padding: 13px 8px;
  }
  button.primary:hover:not(:disabled) { background: var(--amber-d); }

  .speeds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .speeds button.on { background: var(--amber); color: var(--shadow); }
  .fine { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  input[type=range] {
    flex: 1; accent-color: var(--amber); height: 14px; min-width: 0;
  }
  .fine span { font-size: 8px; color: var(--amber); white-space: nowrap; }

  .transport { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 7px; }
  #loop.on { background: var(--amber); color: var(--shadow); }

  /* Blocky progress meter, drawn as discrete cells. */
  .meter {
    height: 14px;
    background: var(--panel-2);
    border: 2px solid var(--shadow);
    display: flex;
    gap: 2px;
    padding: 2px;
    margin: 10px 0 8px;
  }
  /* The gaps cannot shrink, so a long article with one cell per part would
     push the player wider than the sidebar and over the text. Drop the gaps
     once there are many cells, and never let the meter widen its panel. */
  .meter { min-width: 0; overflow: hidden; }
  .meter.dense { gap: 0; }
  .meter i { flex: 1; background: var(--shadow); }
  .meter i.lit { background: var(--green); }
  .stat { font-size: 8px; color: var(--muted); line-height: 1.9; }
  .stat b { color: var(--ink); font-weight: normal; }

  /* ---------- middle: the article ---------- */
  .main { display: grid; gap: 14px; min-width: 0; }
  .main .box { padding: 16px; }

  textarea {
    width: 100%;
    min-height: 320px;
    resize: vertical;
    padding: 14px;
    background: var(--panel-2);
    color: var(--ink);
    border: 2px solid var(--line);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.75;
  }
  textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .reader { display: grid; gap: 10px; }
  .part {
    display: block;
    width: 100%;
    text-align: left;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
    line-height: 1.85;
    color: var(--muted);
    background: transparent;
    border: 2px solid transparent;
    box-shadow: none;
    padding: 11px 13px;
    cursor: pointer;
    white-space: pre-wrap;
  }
  .part:hover { color: var(--ink); background: var(--panel-2); }
  .part:active { transform: none; }
  .part.pending { opacity: .5; cursor: wait; }
  .part.done { color: #b3aac6; }
  .part.now {
    color: var(--ink);
    background: var(--panel-2);
    border-color: var(--amber);
    box-shadow: 3px 3px 0 var(--shadow);
  }
  /* The single word being spoken right now. */
  .w { padding: 1px 0; }
  /* Any word is a seek target, so show it responds to the pointer. */
  .w:hover {
    background: var(--line);
    box-shadow: 2px 0 0 var(--line), -2px 0 0 var(--line);
  }
  .part.pending .w:hover { background: transparent; box-shadow: none; }
  .part.now .w.lit {
    background: var(--amber);
    color: var(--shadow);
    box-shadow: 2px 0 0 var(--amber), -2px 0 0 var(--amber);
  }

  /* Editing the whole article in place. */
  .reader.editing { gap: 0; }
  /* The button only opens the editor, so it is noise while open. */
  .reader.editing ~ * #edit, .editor-open #edit { display: none; }
  .edit-box {
    width: 100%;
    min-height: 240px;
    resize: vertical;
    padding: 10px;
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--amber);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
    line-height: 1.85;
  }
  .edit-box:focus-visible { outline: none; }
  .edit-help {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--muted);
    margin: 7px 0 0;
    line-height: 1.8;
  }
  /* A blinking caret marks the part being spoken. */
  .part.now::before {
    content: "\25B6";
    color: var(--amber);
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    margin-right: 9px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .part.now::before { animation: none; }
  }

  .hint { font-size: 8px; color: var(--muted); margin: 0; line-height: 1.9; }
  .err {
    font-size: 9px; color: var(--shadow); background: #e06666;
    padding: 10px; margin: 0; line-height: 1.8;
  }
  .hidden { display: none !important; }

  /* ---------- phones ---------- */
  @media (max-width: 820px) {
    body { padding-bottom: 0; }
    .layout {
      grid-template-columns: 1fr;
      padding: 12px 12px 0;
      gap: 12px;
    }
    /* Reading comes first; the settings sit below it, out of the way. */
    .main { order: 1; }
    .side { order: 2; position: static; padding-bottom: 12px; }

    /* The player leaves the sidebar and pins to the bottom of the screen,
       so play, speed and progress stay reachable while the article scrolls. */
    #playbox {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      border-width: 3px 0 0;
      box-shadow: 0 -4px 0 var(--shadow);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    #playbox .legend { display: none; }
    #playbox .meter { margin: 8px 0 6px; }
    /* Room so the docked player never covers the end of the page. Its real
       height is measured at runtime into --dock-h; the value here is only a
       first guess for the moment before that runs. */
    .main, .side { padding-bottom: 0; }
    .layout { padding-bottom: calc(var(--dock-h, 200px) + 16px); }
    /* The offset shadow sits outside the box, so full-width boxes would push
       the page wider than the screen. Trim the border and drop the shadow. */
    .main .box, .side .box {
      border-width: 2px;
      box-shadow: none;
      max-width: 100%;
      /* A textarea has an intrinsic width wider than a phone screen, and a
         grid item refuses to shrink below its content by default. */
      min-width: 0;
    }
    textarea { width: 100%; min-width: 0; }

    .transport { grid-template-columns: 1fr 1.6fr 1fr; gap: 10px; }
    .transport button { padding: 14px 8px; font-size: 12px; }
    button.primary { padding: 16px 8px; font-size: 11px; }
    .speeds button { padding: 14px 6px; font-size: 11px; }
    /* A slider is hard to hit with a thumb; give it a taller track. */
    input[type=range] { height: 28px; }
    .part { font-size: 15px; line-height: 1.9; padding: 10px 11px; }
    textarea { min-height: 200px; font-size: 16px; } /* 16px stops iOS zooming */
    h1 { font-size: 12px; }
  }
  .phoneUrl {
    color: var(--amber);
    font-size: 9px;
    line-height: 1.9;
    margin: 8px 0 0;
    /* An address must wrap rather than push the panel wider. */
    overflow-wrap: anywhere;
    user-select: all;
  }
</style>
</head>
<body>
<div class="layout">

  <!-- ================= sidebar: every control ================= -->
  <aside class="side">
    <div class="box">
      <h1>EARFUL</h1>
      <p class="tagline">PASTE TEXT.<br />PRESS PLAY.</p>
    </div>

    <div class="box">
      <p class="legend">// VOICE</p>
      <select id="voice" aria-label="Voice"></select>
      <div style="height:10px"></div>
      <button id="sample" style="width:100%">HEAR VOICE</button>
    </div>

    <div class="box">
      <p class="legend">// SPEED</p>
      <div class="speeds" id="presets">
        <button data-speed="1">1x</button>
        <button data-speed="1.5">1.5x</button>
        <button data-speed="2">2x</button>
      </div>
      <div class="fine">
        <input id="speed" type="range" min="0.5" max="3" step="0.05" value="1" aria-label="Fine speed" />
        <span id="speedLabel">1.00x</span>
      </div>
    </div>

    <div class="box" id="playbox">
      <p class="legend">// PLAYER</p>
      <div class="transport">
        <button id="prev" title="Previous part">&#9198;</button>
        <button id="toggle" title="Play or pause">&#9654;</button>
        <button id="next" title="Next part">&#9197;</button>
      </div>
      <div style="height:7px"></div>
      <button id="loop" class="on" aria-pressed="true" title="Start again from the top when the reading ends" style="width:100%">LOOP: ON</button>
      <div class="meter" id="meter" aria-hidden="true"></div>
      <p class="stat">
        <b id="statusLine">IDLE</b><br />
        <span id="clock"></span>
      </p>
      <div style="height:8px"></div>
      <button id="download" class="hidden" style="width:100%">SAVE .WAV</button>
    </div>

    <div class="box hidden" id="phonebox">
      <p class="legend">// ON YOUR PHONE</p>
      <p class="hint" id="phoneHint">CARRY ON WHERE YOU LEFT OFF</p>
      <p class="phoneUrl" id="phoneUrl"></p>
    </div>
  </aside>

  <!-- ================= middle: the article ================= -->
  <main class="main">
    <div class="box" id="inputBox">
      <p class="legend">// YOUR TEXT</p>
      <textarea id="text" placeholder="Paste an article, a chapter, notes - any length."></textarea>
      <div style="height:12px"></div>
      <button id="go" class="primary">&#9654; READ IT TO ME</button>
      <div style="height:10px"></div>
      <p class="hint" id="count">0 WORDS</p>
      <p class="err hidden" id="error"></p>
    </div>

    <div class="box hidden" id="readerBox">
      <p class="legend">// CLICK A WORD TO JUMP &mdash; DOUBLE-CLICK TO EDIT ALL</p>
      <div class="reader" id="reader"></div>
      <p class="err hidden" id="readerError"></p>
      <div style="height:12px"></div>
      <button id="edit">&#9998; EDIT TEXT</button>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const text = $("text"), voice = $("voice"), speed = $("speed");

// One reused <audio>; swapping its src at a part boundary is what lets
// playback start before the whole document has finished rendering.
const player = new Audio();
player.preservesPitch = true;      // speed up without chipmunk voice
player.mozPreservesPitch = true;
player.webkitPreservesPitch = true;
window.player = player;            // handy from the console

let job = null;        // { id, total, texts }
let ready = 0;         // parts the server has finished
let index = 0;         // part being played now
let resumeAt = 0;      // seconds into that part to start from, after a refresh
let playing = false;
let stream = null;
let waiting = false;   // playback caught up to rendering
let started = false;   // has this job begun playing at all
let pendingSeek = 0;   // where to resume once the new source has loaded
let defaultVoice = "af_heart";  // until /voices answers

/* ---------- text box ---------- */
function refreshCount() {
  const value = text.value.trim();
  const words = value ? value.split(/\s+/).length : 0;
  const minutes = words / (150 * Number(speed.value));
  $("count").textContent = words
    ? `${words.toLocaleString()} WORDS / ~${minutes < 1 ? "<1" : Math.round(minutes)} MIN`
    : "0 WORDS";
}

async function loadVoices() {
  const data = await (await fetch("/voices")).json();
  for (const item of data.voices) {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.label.toUpperCase();
    voice.append(option);
  }
  defaultVoice = data.default;
  // A reading put back after a refresh may have got here first.
  voice.value = (job && job.voice) || data.default;
}

/* ---------- speed ---------- */
const SAVED_SPEED = "readItToMe.speed";
function applySpeed() {
  const rate = Number(speed.value);
  try { localStorage.setItem(SAVED_SPEED, speed.value); } catch { /* fine */ }
  player.playbackRate = rate;
  $("speedLabel").textContent = `${rate.toFixed(2)}x`;
  // Light the preset only when it matches exactly.
  for (const button of $("presets").children) {
    button.classList.toggle("on", Number(button.dataset.speed) === rate);
  }
  refreshCount();
}
function setSpeed(value) {
  speed.value = String(value);
  applySpeed();
}

/* ---------- the article ---------- */
// One span per word, so a single word can be lit while it is spoken.
// Whitespace between words is kept as plain text to preserve wrapping.
function fillWords(part, body) {
  part.textContent = "";
  for (const piece of body.split(/(\s+)/)) {
    if (!piece) continue;
    if (/^\s+$/.test(piece)) {
      part.append(piece);
    } else {
      const word = document.createElement("span");
      word.className = "w";
      word.textContent = piece;
      part.append(word);
    }
  }
}

function makePart(body, i) {
  const part = document.createElement("div");
  part.className = "part";
  part.dataset.i = i;
  part.tabIndex = 0;
  part.setAttribute("role", "button");
  fillWords(part, body);

  // A click on a word starts from that word; anywhere else in the part
  // starts from its beginning.
  part.addEventListener("click", (event) => {
    if (editing) return;
    const word = event.target.closest(".w");
    if (word && part.contains(word)) {
      const spans = [...part.querySelectorAll(".w")];
      jumpToWord(i, spans.indexOf(word));
    } else {
      jumpTo(i);
    }
  });

  // Double-click (or Enter) edits this paragraph where it sits.
  part.addEventListener("dblclick", () => openEditor(i));
  part.addEventListener("keydown", (event) => {
    if (event.target !== part) return;
    if (event.key === "Enter") {
      event.preventDefault();
      openEditor(i);
    }
  });
  return part;
}

function drawReader() {
  const reader = $("reader");
  reader.textContent = "";
  job.texts.forEach((body, i) => reader.append(makePart(body, i)));
  paintReader();
}

/* ---------- editing a paragraph in place ---------- */
let editing = false;   // is the whole-article editor open
let fitEditor = null;  // the open editor's resize handler

// Double-clicking anywhere in the article opens all of it for editing, so a
// change that spans paragraphs can be made in one go.
function openEditor(caretPart = 0) {
  if (editing || !job) return;

  player.pause();
  playing = false;
  waiting = false;     // or the part being waited for starts under the editor
  $("toggle").innerHTML = "&#9654;";
  stopHighlight();
  setStatus();
  editing = true;

  const reader = $("reader");
  reader.classList.add("editing");
  $("readerBox").classList.add("editor-open");
  reader.textContent = "";

  const box = document.createElement("textarea");
  box.className = "edit-box";
  box.value = job.texts.join("\n\n");

  const help = document.createElement("p");
  help.className = "edit-help";
  help.textContent =
    "BLANK LINE STARTS A NEW PART / CMD+ENTER SAVES / ESC CANCELS";

  box.addEventListener("keydown", (event) => {
    event.stopPropagation();          // keys here belong to the editor only
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
      event.preventDefault();
      saveEditor(box.value);
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeEditor();
    }
  });

  reader.append(box, help);

  // Put the caret at the paragraph that was double-clicked.
  const upTo = job.texts.slice(0, caretPart).join("\n\n").length;
  const at = caretPart > 0 ? upTo + 2 : 0;
  box.focus();
  box.setSelectionRange(at, at);
  // Fill the space down to the bottom of the window, and keep filling it as
  // the text grows, so there is no short box with a scrollbar under blank page.
  const fit = () => {
    box.style.height = "auto";
    // scrollHeight excludes the border, but height is set on the border box
    // (box-sizing: border-box), so add it or the last line is clipped.
    const style = getComputedStyle(box);
    const border = parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);
    const toBottom = window.innerHeight - box.getBoundingClientRect().top - 56;
    box.style.height = `${Math.max(box.scrollHeight + border, toBottom, 240)}px`;
  };
  fit();
  box.addEventListener("input", fit);
  window.addEventListener("resize", fit);
  fitEditor = fit;              // so closing can drop the window listener
  box.scrollTop = 0;
}

function closeEditor() {
  if (!editing) return;
  editing = false;
  if (fitEditor) { window.removeEventListener("resize", fitEditor); fitEditor = null; }
  $("reader").classList.remove("editing");
  $("readerBox").classList.remove("editor-open");
  drawReader();
  setStatus();
}

async function saveEditor(value) {
  if (!editing) return;
  const body = value.trim();
  if (!body) { closeEditor(); return; }
  if (body === job.texts.join("\n\n")) { closeEditor(); return; }  // untouched

  // Keep the editor open until the save succeeds, so a failure never throws
  // away what was typed.
  const box = $("reader").querySelector(".edit-box");
  if (box) box.disabled = true;
  $("statusLine").textContent = "SAVING...";
  clearError();

  let response;
  try {
    response = await fetch(`/rewrite/${job.id}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: body })
    });
  } catch (error) {
    if (box) { box.disabled = false; box.focus(); }
    fail(`Could not reach the server: ${error}`);
    return;
  }
  if (!response.ok) {
    const detail = await response.json().catch(() => ({ detail: response.statusText }));
    if (box) { box.disabled = false; box.focus(); }   // your text is still here
    fail(detail.detail || "Could not save the text.");
    return;
  }

  // Saved: now it is safe to close the editor.
  editing = false;
  if (fitEditor) { window.removeEventListener("resize", fitEditor); fitEditor = null; }
  $("reader").classList.remove("editing");
  $("readerBox").classList.remove("editor-open");

  const result = await response.json();
  job.texts = result.texts;
  job.total = result.total;
  rememberJob();   // or a refresh would bring the old text back over the new audio
  renderFailed = false;
  timings.clear();
  ready = 0; index = 0; started = false; waiting = false; pendingSeek = 0;
  player.removeAttribute("src");
  player.load();
  $("download").classList.add("hidden");
  drawReader();
  listenForParts();
}

/* ---------- word-by-word highlight ---------- */
// Timings arrive per part: [{t: "word", s: startSec, e: endSec}, ...]
const timings = new Map();   // part index -> word list
let litWord = -1;            // span index currently lit
let raf = null;

async function loadTimings(i) {
  if (timings.has(i)) return timings.get(i);
  try {
    const response = await fetch(`/words/${job.id}/${i}`);
    if (!response.ok) return null;
    const data = await response.json();
    timings.set(i, data.words);
    return data.words;
  } catch { return null; }
}

// Kokoro emits a token per word AND per punctuation mark, while the reader
// makes a span per whitespace-separated word. Map one to the other by walking
// both in order and matching on letters only.
function alignWords(spans, words) {
  const clean = (s) => s.toLowerCase().replace(/[^a-z0-9']/g, "");
  const map = new Array(spans.length).fill(null);
  let w = 0;
  for (let s = 0; s < spans.length; s++) {
    const target = clean(spans[s].textContent);
    if (!target) continue;
    let built = "";
    const startWord = w;
    while (w < words.length) {
      built += clean(words[w].t);
      w++;
      if (built === target) {                       // one or more tokens = one span
        map[s] = { start: words[startWord].s, end: words[w - 1].e };
        break;
      }
      if (built.length > target.length) {           // drifted; resync
        w = startWord + 1;
        break;
      }
    }
  }
  return map;
}

function stopHighlight() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  document.querySelectorAll(".w.lit").forEach((el) => el.classList.remove("lit"));
  litWord = -1;
}

async function startHighlight(i) {
  stopHighlight();
  const words = await loadTimings(i);
  const part = $("reader").children[i];
  if (!words || !part || index !== i) return;

  const spans = [...part.querySelectorAll(".w")];
  const map = alignWords(spans, words);

  const tick = () => {
    if (!playing || index !== i) { raf = null; return; }
    const now = player.currentTime;
    // Find the span whose window contains the playhead.
    let found = -1;
    for (let s = 0; s < map.length; s++) {
      const span = map[s];
      if (span && now >= span.start && now < span.end) { found = s; break; }
    }
    if (found !== litWord) {
      if (litWord >= 0 && spans[litWord]) spans[litWord].classList.remove("lit");
      if (found >= 0 && spans[found]) spans[found].classList.add("lit");
      litWord = found;
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function paintReader() {
  if (!job) return;
  [...$("reader").children].forEach((part, i) => {
    part.classList.toggle("now", i === index && started);
    part.classList.toggle("done", i < index);
    part.classList.toggle("pending", i >= ready);
  });
}

function drawMeter() {
  const meter = $("meter");
  if (meter.children.length !== job.total) {
    meter.textContent = "";
    for (let i = 0; i < job.total; i++) meter.append(document.createElement("i"));
    meter.classList.toggle("dense", job.total > 40);
  }
  [...meter.children].forEach((cell, i) => cell.classList.toggle("lit", i < ready));
}

function clearError() {
  $("error").classList.add("hidden");
  $("readerError").classList.add("hidden");
}

function setStatus() {
  if (!job) { $("statusLine").textContent = "IDLE"; $("clock").textContent = ""; return; }
  $("statusLine").textContent =
    waiting ? "BUFFERING..."
    : playing ? `PART ${index + 1} / ${job.total}`
    : index >= job.total ? "FINISHED"
    : started ? "PAUSED"
    // Nothing has played yet. Once the audio exists there is nothing left to
    // wait for, so say what to do rather than claiming to still be working.
    : ready >= job.total ? "READY - PRESS PLAY"
    : "GETTING READY...";
  $("clock").textContent = ready < job.total
    ? `${ready}/${job.total} PARTS READY`
    : "ALL PARTS READY";
  drawMeter();
  paintReader();
}

/* ---------- playback ---------- */
function playChunk(i, at = 0) {
  if (!job) return;
  if (i < 0) i = 0;
  if (i >= job.total) {                 // reached the end
    playing = false;
    index = job.total;
    $("toggle").innerHTML = "&#9654;";
    setStatus();
    return;
  }
  if (i >= ready && renderFailed) {     // this part is never going to come
    playing = false;
    waiting = false;
    index = i;
    $("toggle").innerHTML = "&#9654;";
    setStatus();
    $("statusLine").textContent = "STOPPED";
    return;
  }
  if (i >= ready) {                     // rendering has not caught up
    waiting = true;
    index = i;
    setStatus();
    return;
  }
  waiting = false;
  index = i;
  resumeAt = 0;
  const src = `/chunk/${job.id}/${i}.wav`;
  // Assigning the same src is a no-op in browsers, so a part that failed to
  // load (autoplay blocked after a save) would never retry. Force the load.
  if (player.getAttribute("src") === src) {
    player.load();
  } else {
    player.src = src;
  }
  player.playbackRate = Number(speed.value);
  // The source has just changed, so any seek waits for metadata. Record the
  // target instead of adding a listener per jump: a rapid second jump would
  // otherwise leave an earlier listener pending and seek twice.
  pendingSeek = at;
  player.play().catch((error) => {
    // A newer jump cancels a play that is still starting. That is not a stop.
    if (error.name === "AbortError") return;
    playing = false;
    $("toggle").innerHTML = "&#9654;";
    setStatus();
  });
  startHighlight(i);
  setStatus();
  // Keep the spoken part in view without yanking the page around.
  const part = $("reader").children[i];
  if (part) part.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function jumpTo(i, at = 0) {
  if (!job) return;
  i = Math.max(0, Math.min(i, job.total - 1));   // stay inside the article
  if (i >= ready) return;               // not rendered yet
  started = true;
  playing = true;
  $("toggle").innerHTML = "&#10074;&#10074;";
  // Seeking inside the part already loaded: move the playhead, keep the file.
  if (i === index && player.src && player.readyState > 0) {
    player.currentTime = at;
    player.play().catch(() => {});
    startHighlight(i);
    setStatus();
    return;
  }
  playChunk(i, at);
}

// Clicking a word starts playback from that word.
async function jumpToWord(partIndex, spanIndex) {
  if (!job || partIndex >= ready) return;
  const words = await loadTimings(partIndex);
  const part = $("reader").children[partIndex];
  if (!words || !part) { jumpTo(partIndex); return; }

  const spans = [...part.querySelectorAll(".w")];
  const map = alignWords(spans, words);
  // An unmapped word (rare) falls back to the nearest earlier mapped one.
  let at = 0;
  for (let s = spanIndex; s >= 0; s--) {
    if (map[s]) { at = map[s].start; break; }
  }
  jumpTo(partIndex, at);
}

// A newly loaded part starts at whatever word was asked for.
player.addEventListener("loadedmetadata", () => {
  if (pendingSeek > 0) {
    player.currentTime = pendingSeek;
    pendingSeek = 0;
  }
});

player.addEventListener("ended", () => {
  stopHighlight();
  if (!playing) return;
  // With loop on, the end of the last part leads straight back to the first.
  const next = index + 1 >= job.total && loop ? 0 : index + 1;
  playChunk(next);
});

/* ---------- loop ---------- */
// On by default: a reading that ends goes round again until paused. The
// choice is kept in this browser so it survives a refresh.
const SAVED_LOOP = "readItToMe.loop";
let loop = true;
try { loop = localStorage.getItem(SAVED_LOOP) !== "off"; } catch { /* default on */ }

function paintLoop() {
  const button = $("loop");
  button.classList.toggle("on", loop);
  button.setAttribute("aria-pressed", String(loop));
  button.textContent = loop ? "LOOP: ON" : "LOOP: OFF";
}

function toggleLoop() {
  loop = !loop;
  try { localStorage.setItem(SAVED_LOOP, loop ? "on" : "off"); } catch { /* fine */ }
  paintLoop();
}
paintLoop();

/**
 * Tell the server where this reading has got to, so a phone can take over.
 *
 * About once a second while sound is actually coming out. Failure is ignored
 * on purpose: handing over is a convenience and must never interrupt the
 * reading that is happening here.
 */
let handedOff = 0;

function handOff(force) {
  if (!job) return;
  const stamp = Date.now();
  if (!force && stamp - handedOff < 1000) return;
  handedOff = stamp;

  fetch("/handoff", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      job: job.id,
      index,
      at: player.currentTime || 0,
      title: (text.value.trim().split("\n")[0] || "Your reading").slice(0, 80),
    }),
  }).catch(() => { /* handing over is optional */ });
}

player.addEventListener("timeupdate", () => {
  if (playing) handOff(false);
});

// Also sent the moment a reading exists, so picking up the phone works
// without having to press play on the computer first.
player.addEventListener("loadeddata", () => handOff(true));

async function toggle() {
  if (!job) return;
  // Pressing play with the editor open means "read what I typed". Save it, as
  // a voice change does, rather than ignoring the press.
  if (editing) {
    const box = $("reader").querySelector(".edit-box");
    const typed = box ? box.value.trim() : "";
    const changed = typed !== "" && typed !== job.texts.join("\n\n");
    await saveEditor(typed);
    if (editing) return;               // the save failed; keep the editor
    if (changed) return;               // re-reading; the first part starts itself
  }
  if (playing) {
    player.pause();
    playing = false;
    waiting = false;                   // or the part starts when it arrives
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    $("toggle").innerHTML = "&#9654;";
    setStatus();
    return;
  }
  playing = true;
  $("toggle").innerHTML = "&#10074;&#10074;";
  // Resume only if this part is genuinely loaded and part-way through.
  // After a save the src is set but nothing loaded (autoplay is blocked
  // without a click), so play() on it would do nothing at all.
  const loaded = player.readyState > 0 && !player.ended && player.currentTime > 0;
  if (started && loaded) {
    player.play().catch(() => {});      // resume mid-part
    startHighlight(index);
    setStatus();
  } else {
    started = true;
    if (index >= job.total) index = 0; // finished: start again from the top
    playChunk(index, resumeAt);
  }
}

/* ---------- follow parts as the server finishes them ---------- */
const RETRY_MS = 3000;
let renderFailed = false;   // the server stopped, so no more parts will come
let retrying = null;   // the pending try to follow again after a dropped connection

// Used both when a narration starts and when the voice changes, since both
// produce parts one at a time.
/**
 * @param {boolean} [autoplay=true]  whether the first finished part should
 *   start on its own. True when a narration was just asked for, and false
 *   when an earlier one is being put back after a refresh: a page coming back
 *   must not start talking on its own.
 */
function listenForParts(autoplay = true) {
  clearTimeout(retrying);
  if (stream) { stream.close(); stream = null; }
  stream = new EventSource(`/progress/${job.id}`);
  stream.onmessage = (event) => {
    const update = JSON.parse(event.data);
    ready = update.done;

    if (autoplay && ready > 0 && !started) { // first part exists: begin
      started = true;
      playing = true;
      $("toggle").innerHTML = "&#10074;&#10074;";
      playChunk(0);
      // If the browser refused to start (no click yet, common right after a
      // save), show it as paused so the play button reads correctly.
      player.play().then(() => {}).catch((error) => {
        if (error.name === "AbortError") return;   // a newer jump replaced it
        playing = false;
        started = false;
        $("toggle").innerHTML = "&#9654;";
        setStatus();
      });
    } else if (waiting && ready > index) {  // we ran dry, now we can resume
      playChunk(index, resumeAt);
    }

    if (update.state === "ready") {
      stream.close(); stream = null;
      $("download").classList.remove("hidden");
    } else if (update.state === "error") {
      stream.close(); stream = null;
      renderFailed = true;
      if (waiting) {
        waiting = false;
        playing = false;
        $("toggle").innerHTML = "&#9654;";
      }
      fail(update.error);
      return;
    }
    setStatus();
  };
  stream.onerror = () => {
    if (stream) { stream.close(); stream = null; }
    if (job) followAgain(job.id, autoplay);
  };
}

/**
 * Follow the parts again after the connection drops.
 *
 * A Mac that sleeps or a Wi-Fi blip drops the stream, and without this the page
 * never hears of another part. The server is asked first because a stream cannot
 * say why it failed, and a reading it has forgotten will never come back.
 */
function followAgain(id, autoplay) {
  clearTimeout(retrying);
  retrying = setTimeout(async () => {
    if (!job || job.id !== id) return;
    let response = null;
    try {
      response = await fetch(`/progress-once/${id}`, { cache: "no-store" });
    } catch { /* still down: asked again below */ }
    if (!job || job.id !== id || stream) return;

    if (response && response.status === 404) {
      fail("The server no longer has this reading. Start it again to hear the rest.");
    } else if (response && response.ok) {
      listenForParts(autoplay);
    } else {
      if (waiting) $("statusLine").textContent = "LOST THE SERVER - TRYING AGAIN...";
      followAgain(id, autoplay);
    }
  }, RETRY_MS);
}

/* ---------- start a narration ---------- */
async function speak() {
  if (!text.value.trim()) { text.focus(); return; }
  if (stream) { stream.close(); stream = null; }
  player.pause();

  job = null; ready = 0; index = 0;
  rememberJob();  // the old reading is finished with; do not restore it later
  playing = false; waiting = false; started = false;
  stopHighlight();
  timings.clear();
  pendingSeek = 0;
  clearError();
  renderFailed = false;
  $("download").classList.add("hidden");
  $("toggle").innerHTML = "&#9654;";
  $("go").disabled = true;
  $("statusLine").textContent = "GETTING READY...";

  let response;
  try {
    response = await fetch("/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text.value, voice: voice.value || defaultVoice })
    });
  } catch (error) {
    fail(`Could not reach the server: ${error}`);
    return;
  }
  $("go").disabled = false;

  if (!response.ok) {
    const detail = await response.json().catch(() => ({ detail: response.statusText }));
    fail(detail.detail || "Something went wrong.");
    return;
  }

  job = await response.json();
  rememberJob();
  // Offer it to the phone straight away. Waiting for playback would mean a
  // reading the computer never started could not be picked up at all, and
  // browsers routinely refuse to start one without a click.
  handOff(true);
  $("inputBox").classList.add("hidden");
  $("readerBox").classList.remove("hidden");
  drawReader();
  setStatus();

  listenForParts();
}

const SAVED_JOB = "readItToMe.job";

function rememberJob() {
  try {
    if (job) localStorage.setItem(SAVED_JOB, JSON.stringify(job));
    else localStorage.removeItem(SAVED_JOB);
  } catch { /* not worth interrupting for */ }
}

/**
 * Come back to the reading that was open before a refresh.
 *
 * The audio itself lives on the server, so all this needs is the job. The
 * server forgets jobs when it restarts, so it is asked whether this one is
 * still there before the reader is put back on screen.
 */
async function restoreJob() {
  let saved;
  try {
    saved = JSON.parse(localStorage.getItem(SAVED_JOB) || "null");
  } catch { return; }
  if (!saved || !saved.id) return;

  let progress;
  try {
    const response = await fetch(`/progress-once/${saved.id}`, { cache: "no-store" });
    if (!response.ok) { localStorage.removeItem(SAVED_JOB); return; }
    progress = await response.json();
  } catch { return; }

  // The server's text is the truth: an edit made here, or from another tab,
  // may have changed the parts since this copy was saved.
  job = saved;
  if (Array.isArray(progress.texts)) {
    job.texts = progress.texts;
    job.total = progress.total;
    rememberJob();
  }
  $("inputBox").classList.add("hidden");
  $("readerBox").classList.remove("hidden");
  drawReader();

  // Show what the server has already rendered, so a finished reading does not
  // claim to be still working while it waits for the first progress tick.
  ready = progress.done;
  if (progress.state === "ready") $("download").classList.remove("hidden");
  if (progress.voice) {
    job.voice = progress.voice;
    voice.value = job.voice;           // loadVoices sets it, if it comes later
  }

  setStatus();
  // Go back to the last spot in this reading, from this page or the phone.
  // Nothing plays until Play is pressed. With no spot yet, offer this one.
  try {
    const spot = await (await fetch("/handoff", { cache: "no-store" })).json();
    if (spot.job === job.id) {
      index = Math.min(spot.index, job.total - 1);
      resumeAt = spot.at || 0;
      setStatus();
      const part = $("reader").children[index];
      if (part) part.scrollIntoView({ block: "nearest" });
    } else {
      handOff(true);
    }
  } catch { /* handing over is optional */ }
  listenForParts(false);
}

function fail(message) {
  $("go").disabled = false;
  if (job) setStatus();                // the parts ready may have just changed
  $("statusLine").textContent = "STOPPED";
  // Only show the paste box again when there is nothing to fall back to;
  // otherwise the reader stays and both boxes would be on screen at once.
  if (!job) $("inputBox").classList.remove("hidden");
  $("error").textContent = message;
  $("error").classList.remove("hidden");
  $("readerError").textContent = message;
  $("readerError").classList.toggle("hidden", !job);
}

async function sample() {
  $("sample").disabled = true;
  const line = "This is how I sound. I can read your whole article in this voice.";
  let response;
  try {
    response = await fetch("/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: line, voice: voice.value || defaultVoice })
    });
  } catch {
    return;                            // a sample is not worth an error message
  } finally {
    $("sample").disabled = false;
  }
  if (!response.ok) return;
  const audio = new Audio(URL.createObjectURL(await response.blob()));
  audio.preservesPitch = true;
  audio.playbackRate = Number(speed.value);
  audio.play();
}

/* ---------- wiring ---------- */
// The voice did not change and the audio is still there, so say why and let
// Play carry on with what the reader had.
function keepVoice(message) {
  if (job.voice) voice.value = job.voice;
  fail(message);
}

// Picking a voice re-reads the article in it. Without a job yet, the choice
// simply applies to the next one.
voice.addEventListener("change", async () => {
  if (!job) return;
  // A voice change redraws the reader, which would strand an open editor and
  // lose what was typed in it. Save first, then re-read in the new voice.
  if (editing) {
    const box = $("reader").querySelector(".edit-box");
    await saveEditor(box ? box.value : "");
    if (editing) return;               // the save failed; keep the editor
  }
  const chosen = voice.value;
  if (chosen === job.voice) return;    // already reading in this voice
  player.pause();
  playing = false;
  waiting = false;
  $("toggle").innerHTML = "&#9654;";
  stopHighlight();
  timings.clear();
  clearError();
  $("statusLine").textContent = "CHANGING VOICE...";

  let response;
  try {
    response = await fetch(`/voice/${job.id}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voice: chosen })
    });
  } catch (error) {
    keepVoice(`Could not reach the server: ${error}`);
    return;
  }
  if (!response.ok) {
    const detail = await response.json().catch(() => ({ detail: response.statusText }));
    keepVoice(detail.detail || "Could not change the voice.");
    return;
  }
  const result = await response.json();
  renderFailed = false;
  job.voice = chosen;
  rememberJob();
  if (!result.changed) { setStatus(); return; }

  // Start over: the old audio is gone and the new parts arrive one by one.
  $("download").classList.add("hidden");
  ready = 0; index = 0; started = false; waiting = false; pendingSeek = 0;
  player.removeAttribute("src");
  player.load();
  listenForParts();
});

/**
 * Keep the text across a refresh.
 *
 * Closing the tab by accident, or reloading to pick up a change, should not
 * cost a pasted chapter. The text stays in this browser and never goes to the
 * server, which already has whatever was actually read.
 */
const SAVED_TEXT = "readItToMe.text";

function rememberText() {
  try {
    if (text.value) localStorage.setItem(SAVED_TEXT, text.value);
    else localStorage.removeItem(SAVED_TEXT);
  } catch { /* private browsing, or storage full: not worth interrupting for */ }
}

function restoreText() {
  try {
    const saved = localStorage.getItem(SAVED_TEXT);
    // Never overwrite something already in the box; the saved copy is only a
    // fallback for a box that came up empty.
    if (saved && !text.value) {
      text.value = saved;
      refreshCount();
    }
  } catch { /* nothing to restore */ }
}

text.addEventListener("input", refreshCount);
text.addEventListener("input", rememberText);
restoreText();
restoreJob();
speed.addEventListener("input", applySpeed);
for (const button of $("presets").children) {
  button.addEventListener("click", () => setSpeed(Number(button.dataset.speed)));
}
$("go").addEventListener("click", () => { if (!editing) speak(); });
$("sample").addEventListener("click", sample);
$("toggle").addEventListener("click", toggle);
$("loop").addEventListener("click", toggleLoop);
$("prev").addEventListener("click", () => !editing && jumpTo(index - 1));
$("next").addEventListener("click", () => !editing && jumpTo(index + 1));
$("download").addEventListener("click", () => {
  if (job) window.location.href = `/download/${job.id}.wav`;
});
$("edit").addEventListener("click", () => openEditor(index));

document.addEventListener("keydown", (event) => {
  // Keys in a text box, slider or menu belong to it, and Cmd+Left and the like
  // belong to the browser. Nothing moves while the editor is open.
  if (!job || editing || event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.target.closest("input, select, textarea")) return;
  if (event.code === "Space") { event.preventDefault(); toggle(); }
  if (event.code === "ArrowRight") { event.preventDefault(); jumpTo(index + 1); }
  if (event.code === "ArrowLeft") { event.preventDefault(); jumpTo(Math.max(index - 1, 0)); }
});

/* The docked player's height changes as buttons appear (SAVE .WAV) and as
   text wraps, so measure it and reserve exactly that much room below. */
function measureDock() {
  const dock = $("playbox");
  const fixed = getComputedStyle(dock).position === "fixed";
  document.documentElement.style.setProperty(
    "--dock-h", fixed ? `${Math.ceil(dock.getBoundingClientRect().height)}px` : "0px");
}

if (window.ResizeObserver) {
  // border-box, so the reading includes the border and padding rather than
  // just the content, which is what has to be cleared.
  new ResizeObserver(measureDock).observe($("playbox"), { box: "border-box" });
  // Buttons appear and status text rewraps inside the dock without resizing
  // it in the same frame, so watch its contents too.
  new MutationObserver(measureDock).observe($("playbox"), {
    childList: true, subtree: true, attributes: true, characterData: true,
  });
}
// The pixel font loads after first paint and changes every height with it.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(measureDock);
}
window.addEventListener("resize", measureDock);
window.addEventListener("orientationchange", measureDock);

loadVoices();
let savedSpeed = null;
try { savedSpeed = localStorage.getItem(SAVED_SPEED); } catch { /* default */ }
setSpeed(savedSpeed || 1);
refreshCount();
measureDock();

/**
 * Show the address to open on a phone, when there is one worth showing.
 *
 * Only appears when the server is actually reachable from other devices;
 * offering a link that cannot be opened is worse than offering none.
 */
(async function showPhoneLink() {
  try {
    const response = await fetch("/phone");
    if (!response.ok) return;
    const phone = await response.json();
    if (!phone.reachable || !phone.url) return;

    document.getElementById("phoneUrl").textContent = phone.url;
    document.getElementById("phonebox").classList.remove("hidden");

    // A plain local address only works if the network lets devices talk to
    // each other, and plenty of office and guest networks do not. Saying so
    // up front beats a phone that cannot open the link for no visible reason.
    const hint = phone.tunnel
      ? "CARRY ON WHERE YOU LEFT OFF / SAME ADDRESS ALWAYS"
      : "SAME WI-FI ONLY / BLOCKED ON SOME NETWORKS";
    document.getElementById("phoneHint").textContent =
      phone.password ? `${hint} / PASSWORD NEEDED` : hint;
  } catch { /* the link is a convenience, never a blocker */ }
})();
</script>
</body>
</html>
