<!doctype html>
<meta charset="utf-8" />
<title>Earful</title>
<style>
  body {
    width: 260px; margin: 0; padding: 14px;
    background: #221f30; color: #ece5d8;
    font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { font-size: 12px; margin: 0 0 10px; color: #f2b33d; letter-spacing: .04em; }
  label { display: block; margin: 10px 0 4px; color: #a09c94; font-size: 10px; }
  input, select {
    width: 100%; box-sizing: border-box; padding: 7px;
    background: #2c283d; color: #ece5d8; border: 2px solid #453f5c;
    font: inherit;
  }
  button {
    width: 100%; margin-top: 12px; padding: 9px;
    background: #f2b33d; color: #0b0a11; border: 2px solid #0b0a11;
    font: inherit; font-weight: bold; cursor: pointer;
  }
  button.ghost { background: #2c283d; color: #ece5d8; margin-top: 7px; }
  .row { display: flex; gap: 7px; }
  .row button { flex: 1; }
  .note { color: #8b849c; font-size: 10px; margin: 10px 0 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .top h1 { margin: 0; }
  button.lang { width: auto; margin: 0; padding: 4px 9px; background: #2c283d; color: #ece5d8; font-weight: normal; }
  .ok { color: #7bc86c; }
  .bad { color: #e06666; }
</style>

<div class="top">
  <h1 data-i18n="optionsTitle"></h1>
  <button id="language" class="lang" data-i18n="languageSwitch" data-i18n-title="languageLabel"></button>
</div>
<p class="note" data-i18n="optionsHowTo"></p>

<label for="voice" id="voiceLabel" data-i18n="optionsVoice"></label>
<select id="voice"></select>

<div id="zhRow" hidden>
  <label for="voiceZh" data-i18n="optionsVoiceZh"></label>
  <select id="voiceZh"></select>

  <label for="readLanguage" data-i18n="optionsReadLang"></label>
  <select id="readLanguage">
    <option value="" data-i18n="readLangAuto"></option>
    <option value="zh" data-i18n="readLangZh"></option>
    <option value="en" data-i18n="readLangEn"></option>
  </select>
</div>

<label for="server" data-i18n="optionsServer"></label>
<input id="server" type="text" spellcheck="false" placeholder="http://127.0.0.1:8888" />

<label for="password" data-i18n="optionsPassword"></label>
<input id="password" type="password" autocomplete="off" />

<button id="save" class="ghost" data-i18n="optionsSave"></button>
<p class="note" id="note" data-i18n="optionsChecking"></p>

<script src="strings.js"></script>
<script src="options.js"></script>
