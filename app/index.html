<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Read It To Me</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7;
    --panel: #ffffff;
    --ink: #1b1a17;
    --muted: #6b6862;
    --line: #e4e1db;
    --accent: #b4531f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --panel: #1f1e1b;
      --ink: #f2efe9;
      --muted: #a09c94;
      --line: #33302b;
      --accent: #e8874a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 120px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  textarea {
    width: 100%;
    min-height: 240px;
    resize: vertical;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  textarea:focus, select:focus, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1 1 200px; }
  select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button {
    border: 0;
    border-radius: 9px;
    padding: 11px 18px;
    font: 600 14px/1 inherit;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .meta { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }

  /* The player stays on screen while you scroll the text. */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 14px 20px;
    box-shadow: 0 -6px 24px rgba(0,0,0,.07);
  }
  .dock .inner { max-width: 780px; margin: 0 auto; }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .play {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; font-size: 17px; padding: 0; flex: none;
  }
  .speed { flex: 1 1 240px; min-width: 200px; }
  .speed-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 10px 0 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .hidden { display: none; }
  .error { color: #c0392b; font-size: 13px; margin: 6px 0 0; }
  a.download { color: var(--accent); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Read It To Me</h1>
  <p class="sub">Paste anything. It starts reading in a couple of seconds.</p>

  <div class="panel">
    <label for="text">Your text</label>
    <textarea id="text" placeholder="Paste an article, a chapter, notes — any length."></textarea>
    <div class="meta"><span id="count">0 words · 0 characters</span><span id="estimate"></span></div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div class="field" style="flex:0 0 auto">
        <button id="go">Read it to me</button>
        <button id="sample" class="ghost">Hear this voice</button>
      </div>
    </div>
    <p id="error" class="error hidden"></p>
  </div>
</main>

<div class="dock hidden" id="dock">
  <div class="inner">
    <div class="controls">
      <button class="play" id="toggle" title="Play or pause">▶</button>
      <div class="speed">
        <div class="speed-head">
          <label for="speed" style="margin:0">Speed</label>
          <span id="speedLabel">1.00×</span>
        </div>
        <input id="speed" type="range" min="0.5" max="3" step="0.05" value="1" />
      </div>
      <a id="download" class="download hidden" download>Download</a>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta"><span id="status">Getting ready…</span><span id="clock"></span></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const text = $("text"), voice = $("voice"), speed = $("speed");

// One <audio> element per chunk, played back to back. Swapping elements at a
// chunk boundary is what lets playback start before rendering has finished.
const player = new Audio();
player.preservesPitch = true;      // speed up without chipmunk voice
player.mozPreservesPitch = true;
player.webkitPreservesPitch = true;
window.player = player;            // handy from the console

let job = null;        // { id, total }
let ready = 0;         // chunks the server has finished
let index = 0;         // chunk we are playing now
let playing = false;
let stream = null;
let waiting = false;   // playback caught up to rendering
let started = false;   // has this job begun playing at all

function refreshCount() {
  const value = text.value.trim();
  const words = value ? value.split(/\s+/).length : 0;
  $("count").textContent = `${words.toLocaleString()} words · ${text.value.length.toLocaleString()} characters`;
  // Kokoro narrates at roughly 150 words per minute at 1x.
  const minutes = words / (150 * Number(speed.value));
  $("estimate").textContent = words
    ? `about ${minutes < 1 ? "under a minute" : Math.round(minutes) + " min"} of listening`
    : "";
}

async function loadVoices() {
  const data = await (await fetch("/voices")).json();
  for (const item of data.voices) {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.label;
    voice.append(option);
  }
  voice.value = data.default;
}

function applySpeed() {
  const rate = Number(speed.value);
  player.playbackRate = rate;
  $("speedLabel").textContent = `${rate.toFixed(2)}×`;
  refreshCount();
}

function setStatus() {
  if (!job) return;
  if (waiting) {
    $("status").textContent = "Catching up with the reader…";
  } else if (playing) {
    $("status").textContent = `Reading part ${index + 1} of ${job.total}`;
  } else if (index >= job.total) {
    $("status").textContent = "Finished";
  } else {
    $("status").textContent = "Paused";
  }
  $("clock").textContent = ready < job.total ? `${ready} of ${job.total} parts ready` : "all parts ready";
  $("fill").style.width = `${(ready / job.total) * 100}%`;
}

function playChunk(i) {
  if (!job) return;
  if (i >= job.total) {          // reached the end
    playing = false;
    $("toggle").textContent = "▶";
    index = job.total;
    setStatus();
    return;
  }
  if (i >= ready) {              // rendering has not caught up yet
    waiting = true;
    setStatus();
    return;
  }
  waiting = false;
  index = i;
  player.src = `/chunk/${job.id}/${i}.wav`;
  player.playbackRate = Number(speed.value);
  player.play().catch(() => { playing = false; $("toggle").textContent = "▶"; });
  setStatus();
}

player.addEventListener("ended", () => { if (playing) playChunk(index + 1); });

function toggle() {
  if (!job) return;
  if (playing) {
    player.pause();
    playing = false;
    $("toggle").textContent = "▶";
    setStatus();
    return;
  }
  playing = true;
  $("toggle").textContent = "❚❚";
  if (started && !player.ended && player.currentTime > 0) {
    player.play().catch(() => {});   // resume mid-chunk
    setStatus();
  } else {
    started = true;
    playChunk(index);
  }
}

async function speak() {
  if (!text.value.trim()) { text.focus(); return; }
  if (stream) { stream.close(); stream = null; }
  player.pause();

  job = null; ready = 0; index = 0; playing = false; waiting = false; started = false;
  $("error").classList.add("hidden");
  $("download").classList.add("hidden");
  $("dock").classList.remove("hidden");
  $("fill").style.width = "0";
  $("status").textContent = "Getting ready…";
  $("toggle").textContent = "▶";
  $("go").disabled = true;

  const response = await fetch("/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text.value, voice: voice.value })
  });
  $("go").disabled = false;

  if (!response.ok) {
    const detail = await response.json().catch(() => ({ detail: response.statusText }));
    fail(detail.detail || "Something went wrong.");
    return;
  }

  job = await response.json();
  stream = new EventSource(`/progress/${job.id}`);
  stream.onmessage = (event) => {
    const update = JSON.parse(event.data);
    ready = update.done;

    // Start as soon as the first chunk exists; resume if we ran dry.
    if (ready > 0 && !started) {
      started = true;
      playing = true;
      $("toggle").textContent = "❚❚";
      playChunk(0);
    } else if (waiting && ready > index) {
      playChunk(index);
    }

    if (update.state === "ready") {
      stream.close(); stream = null;
      const link = $("download");
      link.href = `/download/${job.id}.wav`;
      link.classList.remove("hidden");
    } else if (update.state === "error") {
      stream.close(); stream = null;
      fail(update.error);
      return;
    }
    setStatus();
  };
  stream.onerror = () => { if (stream) { stream.close(); stream = null; } };
}

function fail(message) {
  $("go").disabled = false;
  $("status").textContent = "Stopped";
  $("error").textContent = message;
  $("error").classList.remove("hidden");
}

async function sample() {
  $("sample").disabled = true;
  const line = "This is how I sound. I can read your whole article in this voice, start to finish.";
  const response = await fetch("/preview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: line, voice: voice.value })
  });
  $("sample").disabled = false;
  if (!response.ok) return;
  const audio = new Audio(URL.createObjectURL(await response.blob()));
  audio.preservesPitch = true;
  audio.playbackRate = Number(speed.value);
  audio.play();
}

text.addEventListener("input", refreshCount);
speed.addEventListener("input", applySpeed);
$("toggle").addEventListener("click", toggle);
$("go").addEventListener("click", speak);
$("sample").addEventListener("click", sample);
// Space toggles playback, unless you are typing in the box.
document.addEventListener("keydown", (event) => {
  if (event.code === "Space" && event.target !== text && job) {
    event.preventDefault();
    toggle();
  }
});
loadVoices();
refreshCount();
</script>
</body>
</html>
